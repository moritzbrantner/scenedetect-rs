[workspace]
members = [
    "crates/scenedetect-cli",
    "crates/scenedetect-core",
    "crates/scenedetect-ffmpeg",
    "crates/scenedetect-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
homepage = "https://github.com/moritzbrantner/scenedetect-rs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/moritzbrantner/scenedetect-rs"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
csv = "1"
predicates = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
media-core = { package = "moenarch-media-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "88ea1375c5c2b459cc7dd721e5ed6f99de172113" }
