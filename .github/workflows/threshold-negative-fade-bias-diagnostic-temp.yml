name: Threshold negative fade-bias diagnostic

on:
  push:
    branches:
      - verify/threshold-negative-fade-bias-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          enable-cache: false
      - name: Run focused quality case
        run: bun run quality:generated -- --case generated-threshold-negative-fade-bias
      - name: Print exact comparison
        if: always()
        run: |
          echo '=== report ==='
          cat tests/quality/output/report.json || true
          echo '=== reference ==='
          cat tests/quality/output/cases/generated-threshold-negative-fade-bias/reference-scenes.json || true
          echo '=== candidate ==='
          cat tests/quality/output/cases/generated-threshold-negative-fade-bias/candidate-scenes.json || true
