name: Patch issue 96 Content HSV temp

on:
  push:
    branches:
      - agent-loop/issue-96-content-hsv

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message != 'Match Content scoring to HSV components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-96-content-hsv
      - name: Apply HSV scoring patch
        run: python3 .github/patch-96-temp.py
      - name: Install tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Verify core regression
        run: |
          cargo fmt --all
          cargo test -p scenedetect-core --test content_components
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Verify generated quality
        run: |
          bash scripts/run-generated-quality.sh --case generated-content-hue-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          case = report['cases'][0]
          assert case['reference_boundary_count'] == 1, case
          assert case['candidate_boundary_count'] == 1, case
          assert case['matched_boundary_count'] == 1, case
          assert case['false_negative_count'] == 0, case
          assert case['false_positive_count'] == 0, case
          PY
          bash scripts/run-generated-quality.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          assert report['totals']['false_positives'] == 0, report
          assert report['totals']['false_negatives'] == 0, report
          PY
      - name: Verify PySceneDetect CLI parity
        run: tests/parity/run-all.sh
      - name: Commit HSV scoring fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-core/src/lib.rs
          git commit -m "Match Content scoring to HSV components"
          git push origin HEAD:agent-loop/issue-96-content-hsv
