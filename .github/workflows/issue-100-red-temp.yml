name: Issue 100 edge apply temp

on:
  push:
    branches:
      - agent-loop/issue-100-content-edges

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "${{ github.event.head_commit.message != 'fix: match Content edge scoring to PySceneDetect' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-100-content-edges
      - name: Apply edge implementation
        run: python3 .github/issue-100-apply-temp.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused Rust behavior
        run: |
          cargo fmt --all
          cargo test -p scenedetect-core --test content_components
          cargo test -p scenedetect-core
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify focused edge quality
        run: |
          bash scripts/run-generated-quality.sh --case generated-content-edge-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          case = report['cases'][0]
          print(json.dumps(case, indent=2, sort_keys=True))
          assert case['reference_boundary_count'] == 1, case
          assert case['candidate_boundary_count'] == 1, case
          assert case['matched_boundary_count'] == 1, case
          assert case['false_negative_count'] == 0, case
          assert case['false_positive_count'] == 0, case
          PY
      - name: Verify full generated quality corpus
        run: |
          bash scripts/run-generated-quality.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          print(json.dumps(report['totals'], indent=2, sort_keys=True))
          assert report['totals']['false_positives'] == 0, report
          assert report['totals']['false_negatives'] == 0, report
          PY
      - name: Verify repository gate
        run: bun run agent:check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-core/src/lib.rs
          git commit -m "fix: match Content edge scoring to PySceneDetect"
          git push origin HEAD:agent-loop/issue-100-content-edges
