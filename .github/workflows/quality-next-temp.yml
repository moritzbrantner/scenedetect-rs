name: Quality next divergence temp

on:
  push:
    branches:
      - agent-loop/quality-next

permissions:
  contents: read

jobs:
  generated-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Run generated quality corpus
        run: bash scripts/run-generated-quality.sh
      - name: Print ranked quality report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          print('QUALITY_TOTALS=' + json.dumps(report['totals'], sort_keys=True))
          print('QUALITY_DIVERGENCES=' + json.dumps(report['worst_divergences'], sort_keys=True))
          PY
