name: Verify issue 83

on:
  push:
    branches:
      - agent-loop/issue-83-native-detectors

permissions:
  contents: read

env:
  UV_VERSION: 0.11.21

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native detector test
        run: cargo test -p scenedetect-cli --test native_detectors
      - name: Threshold oracle parity
        run: python3 tests/parity/run.py --case threshold-fade-return
      - name: Histogram oracle parity
        run: python3 tests/parity/run.py --case hist-hard-cut
      - name: Hash oracle parity
        run: python3 tests/parity/run.py --case hash-pattern-cut
