name: Verify issue 96 HSV patch

on:
  push:
    branches:
      - agent-loop/issue-96-content-hsv-v2

permissions:
  contents: read

env:
  UV_VERSION: 0.11.21

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Repository correctness gate
        run: bun run agent:check

      - name: Focused generated quality case
        run: |
          bash scripts/run-generated-quality.sh --case generated-content-hue-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/report.json').read_text())
          case = report['cases'][0]
          assert case['reference_boundary_count'] == 1, case
          assert case['candidate_boundary_count'] == 1, case
          assert case['matched_boundary_count'] == 1, case
          assert case['false_negative_count'] == 0, case
          assert case['false_positive_count'] == 0, case
          PY
