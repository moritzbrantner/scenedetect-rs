name: Patch issue 90 quality review findings

on:
  push:
    branches:
      - agent-loop/issue-85-real-video-quality

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message != 'Fix quality loop safety and boundary matching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-85-real-video-quality
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          run_path = Path('tests/quality/run.py')
          text = run_path.read_text()
          text = replace_once(
              text,
              'import os\nimport shutil',
              'import os\nimport re\nimport shutil',
              're import',
          )
          text = replace_once(
              text,
              'DETECTORS = {"content", "adaptive", "threshold", "hist", "hash"}\n',
              'DETECTORS = {"content", "adaptive", "threshold", "hist", "hash"}\nSAFE_CASE_ID = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")\n',
              'safe id pattern',
          )
          text = replace_once(
              text,
              '''        case_id = require_string(case, "id", index)\n        if case_id in seen_ids:\n''',
              '''        case_id = require_string(case, "id", index)\n        if not SAFE_CASE_ID.fullmatch(case_id):\n            raise ConfigError(\n                f"case id {case_id!r} must be a single safe path component "\n                "using only letters, digits, dot, underscore, and hyphen"\n            )\n        if case_id in seen_ids:\n''',
              'case id validation',
          )
          old_match = '''def match_boundaries(\n    reference: list[int], candidate: list[int], tolerance: int\n) -> tuple[list[dict[str, int]], list[int], list[int]]:\n    unmatched = set(range(len(candidate)))\n    matches: list[dict[str, int]] = []\n    false_negatives: list[int] = []\n    for reference_frame in reference:\n        choices = [\n            (abs(candidate[index] - reference_frame), candidate[index], index)\n            for index in unmatched\n            if abs(candidate[index] - reference_frame) <= tolerance\n        ]\n        if not choices:\n            false_negatives.append(reference_frame)\n            continue\n        delta_abs, candidate_frame, index = min(choices)\n        unmatched.remove(index)\n        matches.append(\n            {\n                "reference_frame": reference_frame,\n                "candidate_frame": candidate_frame,\n                "delta_frames": candidate_frame - reference_frame,\n                "absolute_delta_frames": delta_abs,\n            }\n        )\n    false_positives = [candidate[index] for index in sorted(unmatched)]\n    return matches, false_positives, false_negatives\n'''
          new_match = '''def match_boundaries(\n    reference: list[int], candidate: list[int], tolerance: int\n) -> tuple[list[dict[str, int]], list[int], list[int]]:\n    # Boundary lists are ordered by frame. Dynamic programming over ordered\n    # prefixes maximizes one-to-one match cardinality first, then minimizes\n    # total absolute frame delta. This avoids greedy choices consuming the only\n    # candidate available to a neighboring reference boundary.\n    match_action = 1\n    skip_reference_action = 2\n    skip_candidate_action = 3\n    action_priority = {\n        match_action: 2,\n        skip_reference_action: 1,\n        skip_candidate_action: 0,\n    }\n\n    def better(\n        score: tuple[int, int],\n        action: int,\n        best_score: tuple[int, int],\n        best_action: int,\n    ) -> bool:\n        if score[0] != best_score[0]:\n            return score[0] > best_score[0]\n        if score[1] != best_score[1]:\n            return score[1] < best_score[1]\n        return action_priority[action] > action_priority[best_action]\n\n    width = len(candidate) + 1\n    back = bytearray((len(reference) + 1) * width)\n    for column in range(1, width):\n        back[column] = skip_candidate_action\n\n    previous = [(0, 0)] * width\n    for row, reference_frame in enumerate(reference, start=1):\n        current = [(0, 0)] * width\n        back[row * width] = skip_reference_action\n        for column, candidate_frame in enumerate(candidate, start=1):\n            best_score = previous[column]\n            best_action = skip_reference_action\n\n            left_score = current[column - 1]\n            if better(\n                left_score, skip_candidate_action, best_score, best_action\n            ):\n                best_score = left_score\n                best_action = skip_candidate_action\n\n            delta = abs(candidate_frame - reference_frame)\n            if delta <= tolerance:\n                diagonal = previous[column - 1]\n                match_score = (diagonal[0] + 1, diagonal[1] + delta)\n                if better(match_score, match_action, best_score, best_action):\n                    best_score = match_score\n                    best_action = match_action\n\n            current[column] = best_score\n            back[row * width + column] = best_action\n        previous = current\n\n    matched_pairs: list[tuple[int, int]] = []\n    row = len(reference)\n    column = len(candidate)\n    while row > 0 or column > 0:\n        action = back[row * width + column]\n        if action == match_action:\n            matched_pairs.append((row - 1, column - 1))\n            row -= 1\n            column -= 1\n        elif action == skip_reference_action:\n            row -= 1\n        elif action == skip_candidate_action:\n            column -= 1\n        else:\n            raise AssertionError("invalid boundary matching backpointer")\n    matched_pairs.reverse()\n\n    matched_reference = {reference_index for reference_index, _ in matched_pairs}\n    matched_candidate = {candidate_index for _, candidate_index in matched_pairs}\n    matches = []\n    for reference_index, candidate_index in matched_pairs:\n        reference_frame = reference[reference_index]\n        candidate_frame = candidate[candidate_index]\n        matches.append(\n            {\n                "reference_frame": reference_frame,\n                "candidate_frame": candidate_frame,\n                "delta_frames": candidate_frame - reference_frame,\n                "absolute_delta_frames": abs(candidate_frame - reference_frame),\n            }\n        )\n    false_positives = [\n        frame\n        for index, frame in enumerate(candidate)\n        if index not in matched_candidate\n    ]\n    false_negatives = [\n        frame\n        for index, frame in enumerate(reference)\n        if index not in matched_reference\n    ]\n    return matches, false_positives, false_negatives\n'''
          text = replace_once(text, old_match, new_match, 'boundary matcher')
          run_path.write_text(text)

          test_path = Path('tests/quality/test-runner.py')
          tests = test_path.read_text()
          anchor = '''        self.assertEqual(false_positives, [40])\n        self.assertEqual(false_negatives, [30])\n\n'''
          addition = '''        self.assertEqual(false_positives, [40])\n        self.assertEqual(false_negatives, [30])\n\n    def test_matching_maximizes_cardinality_before_delta(self) -> None:\n        matches, false_positives, false_negatives = quality.match_boundaries(\n            [10, 11], [9, 10], 1\n        )\n        self.assertEqual(\n            [(item["reference_frame"], item["candidate_frame"]) for item in matches],\n            [(10, 9), (11, 10)],\n        )\n        self.assertEqual(false_positives, [])\n        self.assertEqual(false_negatives, [])\n\n'''
          tests = replace_once(tests, anchor, addition, 'matching regression test')
          anchor = '''            selected = quality.select_cases(config["cases"], {"one"}, {"content"})\n            self.assertEqual([case["id"] for case in selected], ["one"])\n\n'''
          addition = '''            selected = quality.select_cases(config["cases"], {"one"}, {"content"})\n            self.assertEqual([case["id"] for case in selected], ["one"])\n\n    def test_manifest_rejects_case_ids_that_can_escape_work_directory(self) -> None:\n        for case_id in ["/tmp/project", "../project", "nested/case", r"nested\\case"]:\n            with self.subTest(case_id=case_id), tempfile.TemporaryDirectory() as directory:\n                manifest = Path(directory) / "corpus.toml"\n                manifest.write_text(\n                    f'''\n                    [[cases]]\n                    id = {case_id!r}\n                    video = "video.mp4"\n                    detector = "content"\n                    threshold = 27.0\n                    '''\n                )\n                with self.assertRaisesRegex(\n                    quality.ConfigError, "single safe path component"\n                ):\n                    quality.load_config(manifest)\n\n'''
          tests = replace_once(tests, anchor, addition, 'safe id regression test')
          test_path.write_text(tests)
          PY
      - name: Install tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Unit and manifest checks
        run: |
          python3 tests/quality/test-runner.py
          python3 tests/quality/run.py --manifest tests/quality/corpus.example.toml --validate-only
      - name: Generate canary video and manifest
        run: |
          mkdir -p tests/quality/local-media
          ffmpeg -v error \
            -f lavfi -i color=c=black:s=16x16:d=0.3:r=10 \
            -f lavfi -i color=c=white:s=16x16:d=0.3:r=10 \
            -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0' \
            -pix_fmt yuv420p tests/quality/local-media/canary.mp4
          cat > tests/quality/corpus.local.toml <<'EOF'
          [quality]
          tolerance_frames = 1

          [[cases]]
          id = "canary-content"
          video = "local-media/canary.mp4"
          detector = "content"
          threshold = 20.0
          min_scene_len = "1"
          EOF
      - name: End-to-end quality canary
        run: |
          python3 tests/quality/run.py --report tests/quality/output/canary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/quality/output/canary.json').read_text())
          assert report['totals']['cases'] == 1
          assert report['totals']['false_positives'] == 0
          assert report['totals']['false_negatives'] == 0
          PY
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/quality/run.py tests/quality/test-runner.py
          git commit -m "Fix quality loop safety and boundary matching"
          git push origin HEAD:agent-loop/issue-85-real-video-quality
