name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Rust release as the native fresh-clone image in ci.yml.
  RUST_TOOLCHAIN: 1.98.1

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust WebAssembly toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown

      - name: Build Pages artifact from committed sources
        # Builds site/wasm/scenedetect_wasm.wasm with
        # `cargo build --locked -p scenedetect-wasm --target wasm32-unknown-unknown --release`
        # and fails if site/ holds any other file that is not committed (#152).
        run: scripts/build-pages.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/capabilities.js
          node --check site/quality.js
          node --check site/scenedetect-wasm.js
          node --check site/video-frame-sync.js
          node --check site/review-overview.js
          node --check site/review-workspace.js
          node --check site/review-workspace-selection.test.js
          node --check site/timeline-cut-inspector.js
          node --check site/analysis-worker.js
          node --check site/analysis-worker-client.js
          node --check site/analysis-insights.js
          node --check site/analysis-insights-bootstrap.js
          node --check site/analysis-insights.test.js
          node --check site/session-store.js
          node --check site/session-store.test.js
          node --check site/keyboard-controls.js
          node --check site/workbench.js

      - name: Test session restoration invariants
        run: node --test site/session-store.test.js

      - name: Test timeline cut selection contract
        run: node --test site/review-workspace-selection.test.js

      - name: Test analysis insight preview semantics
        run: node --test site/analysis-insights.test.js

      - name: Verify timeline and analysis insights are published
        run: |
          grep -Fq 'timeline-cut-inspector.css' site/workbench.html
          grep -Fq 'timeline-cut-inspector.js' site/workbench.html
          grep -Fq 'Before / after frame inspector' site/workbench.html
          grep -Fq 'analysis-insights.css' site/workbench.html
          grep -Fq 'analysis-insights-bootstrap.js' site/workbench.html
          grep -Fq 'Change-point heatmap' site/workbench.html
          grep -Fq 'Scene similarity' site/workbench.html
          grep -Fq 'scenedetect_similarity_configure' site/scenedetect-wasm.js
          grep -Fq 'shared visual-analysis DCT perceptual hash' site/analysis-insights.js
          grep -Fq 'pHash distance' site/analysis-insights.js

      - name: Check site
        run: python3 scripts/check-site.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  browser-acceptance:
    # Real-browser acceptance for the published scene lab (#152). No path
    # filters and no `needs`, so this check runs on every pull-request head and
    # is never skipped. Keep the job name stable.
    name: Scene lab browser acceptance
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust WebAssembly toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Pages artifact from committed sources
        run: scripts/build-pages.sh

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser acceptance against the built site
        run: bun run tdd:browser

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [validate, browser-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
