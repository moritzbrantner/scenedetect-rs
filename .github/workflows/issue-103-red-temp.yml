name: Issue 103 frame timing apply temp

on:
  push:
    branches:
      - agent-loop/issue-103-frame-timing

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "${{ github.event.head_commit.message != 'feat: add backward-compatible frame timing seam' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-103-frame-timing
      - name: Apply core timing seam
        run: python3 .github/issue-103-core-patch-temp.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Verify core timing contract
        run: |
          cargo fmt --all
          cargo test -p scenedetect-core --test consumer_contract
          cargo test -p scenedetect-core
      - name: Verify FFmpeg timing contract
        run: |
          cargo test -p scenedetect-ffmpeg --test frame_source
      - name: Verify lint and repository gate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          bun run agent:check
      - name: Commit core implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-core/src/lib.rs
          git commit -m "feat: add backward-compatible frame timing seam"
          git push origin HEAD:agent-loop/issue-103-frame-timing
