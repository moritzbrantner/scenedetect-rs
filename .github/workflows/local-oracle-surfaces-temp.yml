name: Temporary local oracle surfaces

on:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: 0.11.21

jobs:
  local-oracle-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Refresh representative local golden
        run: python3 tests/local-oracle/run.py refresh --case content-hard-cut
      - name: Check public output surfaces
        run: python3 tests/local-oracle/check-surfaces.py --case content-hard-cut
