name: Scene Timeline final agent check

on:
  push:
    branches:
      - verify/scene-timeline-agent-check-final

permissions:
  contents: read

env:
  UV_VERSION: 0.11.21

jobs:
  agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare PySceneDetect oracle
        run: scripts/setup-python-oracle.sh

      - name: Run exact handoff contract
        run: bun run agent:check
