name: Patch threshold negative fade bias

on:
  push:
    branches:
      - fix/threshold-negative-fade-bias

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-negative-fade-bias]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/threshold-negative-fade-bias
      - name: Patch parser and focused CLI regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/scenedetect-cli/src/main.rs')
          text = main.read_text()
          old = '''    #[arg(short = 'f', long = "fade-bias", default_value_t = 0.0)]
              fade_bias: f64,'''
          new = '''    #[arg(
              short = 'f',
              long = "fade-bias",
              default_value_t = 0.0,
              allow_hyphen_values = true,
              value_parser = parse_fade_bias
          )]
              fade_bias: f64,'''
          if old not in text:
              raise SystemExit('native fade-bias argument pattern not found')
          text = text.replace(old, new, 1)
          marker = '''fn parse_1_to_256(value: &str) -> std::result::Result<usize, String> {'''
          helper = '''fn parse_fade_bias(value: &str) -> std::result::Result<f64, String> {
              let parsed = value
                  .parse::<f64>()
                  .map_err(|_| format!("{value:?} is not a number"))?;
              if (-1.0..=1.0).contains(&parsed) {
                  Ok(parsed)
              } else {
                  Err(format!("{parsed} must be between -1.0 and 1.0"))
              }
          }

          '''
          if marker not in text:
              raise SystemExit('parser helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)
          main.write_text(text)

          cli = Path('crates/scenedetect-cli/tests/cli.rs')
          tests = cli.read_text()
          name = 'native_threshold_accepts_negative_fade_bias'
          if name not in tests:
              tests += r'''

          #[test]
          fn native_threshold_accepts_negative_fade_bias() {
              if !ffmpeg_available() {
                  eprintln!("skipping CLI integration test because ffmpeg is unavailable");
                  return;
              }

              let temp = tempfile::tempdir().unwrap();
              let video = temp.path().join("negative-fade-bias.mp4");
              write_threshold_final_fade_video(&video);

              let mut cmd = Command::cargo_bin("scenedetect-rs").unwrap();
              cmd.args(["detect", "threshold"])
                  .arg("-i")
                  .arg(&video)
                  .args([
                      "--fade-bias",
                      "-1",
                      "--min-scene-len",
                      "1",
                      "--progress",
                      "never",
                      "--quiet",
                  ])
                  .assert()
                  .success();
          }

          #[test]
          fn native_threshold_rejects_fade_bias_outside_detector_range() {
              let mut cmd = Command::cargo_bin("scenedetect-rs").unwrap();
              cmd.args([
                  "detect",
                  "threshold",
                  "-i",
                  "missing.mp4",
                  "--fade-bias",
                  "-1.1",
              ])
              .assert()
              .failure()
              .stderr(predicate::str::contains(
                  "must be between -1.0 and 1.0",
              ));
          }
          '''
              cli.write_text(tests)
          PY
          cargo fmt --all
          git rm .github/workflows/threshold-negative-fade-bias-patch-temp.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-cli/src/main.rs crates/scenedetect-cli/tests/cli.rs
          git commit -m "fix(cli): accept negative threshold fade bias [patched-negative-fade-bias]"
          git push origin HEAD:fix/threshold-negative-fade-bias
