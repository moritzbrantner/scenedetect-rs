name: Patch issue 89 diagnostics

on:
  push:
    branches:
      - agent-loop/issue-84-native-ergonomics

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message != 'Preserve Detection Stats diagnostic compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-84-native-ergonomics
      - name: Preserve legacy diagnostic substrings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/scenedetect-cli/src/native_stats.rs')
          text = path.read_text()
          replacements = {
              'Detection Stats artifact {} is missing. Recovery: `{}`': 'Detection Stats are missing: artifact {}. Recovery: `{}`',
              'Detection Stats artifact {} is malformed: {}. Recovery: `{}`': 'failed to parse Detection Stats artifact {} (malformed): {}. Recovery: `{}`',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install Rust and FFmpeg
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p scenedetect-cli --test cli
          cargo test -p scenedetect-cli --test native_inspect
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-cli/src/native_stats.rs
          git commit -m "Preserve Detection Stats diagnostic compatibility"
          git push origin HEAD:agent-loop/issue-84-native-ergonomics
