name: Temporary issue 58 changed-surface verification

on:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: 0.11.21

jobs:
  issue-58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Verify pinned PySceneDetect oracle setup
        run: scripts/setup-python-oracle.sh >/dev/null
      - name: Validate benchmark configuration
        run: python3 tests/benchmarks/validate.py
      - name: Validate benchmark runner shell syntax
        run: bash -n tests/benchmarks/run-hyperfine.sh scripts/setup-python-oracle.sh
      - name: Verify benchmark timing remains report-only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          scripts = json.loads(Path('package.json').read_text())['scripts']
          for gate in ('tdd:check', 'agent:check'):
              value = scripts[gate]
              if 'benchmark:generated' in value or 'benchmark:real' in value or 'hyperfine' in value:
                  raise SystemExit(f'{gate} unexpectedly runs benchmark timing: {value}')
          print('benchmark timing remains report-only')
          PY
