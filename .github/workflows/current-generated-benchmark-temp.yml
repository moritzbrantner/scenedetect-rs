name: Current generated benchmark

on:
  push:
    branches:
      - benchmarks/current-generated-2026-09-10

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg hyperfine curl

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run generated Benchmark Corpus
        run: bun run benchmark:generated

      - name: Build current snapshot artifact
        run: |
          python3 scripts/update-site-benchmarks.py \
            --input tests/benchmarks/results/cli.json \
            --output current-generated-benchmarks.json \
            --machine-label github-actions-ubuntu-latest \
            --candidate-ref 262d42c2d692d13b0540562805e239c61f6e0865 \
            --command 'tests/benchmarks/run-hyperfine.sh --generated-only' \
            --notes 'Generated Benchmark Corpus only; measured on a GitHub-hosted ubuntu-latest runner; timing is report-only and machine-sensitive.'
          cat current-generated-benchmarks.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-generated-benchmarks
          path: current-generated-benchmarks.json
