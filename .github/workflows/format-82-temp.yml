name: Format issue 82

on:
  push:
    branches:
      - agent-loop/issue-82-native-adaptive

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format issue 82'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-82-native-adaptive
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-cli/src/main.rs crates/scenedetect-cli/src/native_stats.rs crates/scenedetect-cli/tests/native_adaptive.rs
          if git diff --cached --quiet; then
            echo "already formatted"
          else
            git commit -m "Format issue 82"
            git push origin HEAD:agent-loop/issue-82-native-adaptive
          fi
