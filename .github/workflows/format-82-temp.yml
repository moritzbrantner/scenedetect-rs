name: Repair issue 82

on:
  push:
    branches:
      - agent-loop/issue-82-native-adaptive

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Apply issue 82 clippy repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-82-native-adaptive
      - name: Remove superseded content-only reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/scenedetect-cli/src/native_stats.rs')
          text = path.read_text()
          old = '''pub fn read_detection_stats_for_input(input: &Path) -> Result<ContentDetectionStats> {\n    read_detection_stats_document_for_input(input)?.into_content_stats()\n}\n\n'''
          if old not in text:
              raise SystemExit('obsolete reader patch anchor is missing')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-cli/src/native_stats.rs
          git commit -m "Apply issue 82 clippy repair"
          git push origin HEAD:agent-loop/issue-82-native-adaptive
