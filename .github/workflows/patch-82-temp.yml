name: Apply issue 82 patch

on:
  push:
    branches:
      - agent-loop/issue-82-native-adaptive

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply issue 82 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-loop/issue-82-native-adaptive
      - name: Apply patch
        run: python3 scripts/patch-82-temp.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/scenedetect-cli/src/main.rs crates/scenedetect-cli/tests/native_adaptive.rs tests/parity/run.py tests/parity/cases.toml
          if git diff --cached --quiet; then
            echo "issue 82 patch already applied"
          else
            git commit -m "Apply issue 82 patch"
            git push origin HEAD:agent-loop/issue-82-native-adaptive
          fi
