name: Current generated quality evidence

on:
  push:
    branches:
      - site/evidence-driven-reference

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run generated quality corpus
        run: bun run quality:generated

      - name: Build sanitized site snapshot
        run: |
          python3 scripts/update-site-quality.py \
            --input tests/quality/output/report.json \
            --output /tmp/generated-quality.json \
            --candidate-ref "$(git rev-parse HEAD~1)" \
            --machine-label github-actions-ubuntu-latest
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/generated-quality.json'))
          print(json.dumps({
              'generated_at': data['generated_at'],
              'candidate_ref': data['candidate_ref'],
              'totals': data['totals'],
              'worst_divergences': data['worst_divergences'],
          }, indent=2))
          PY

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-generated-quality
          path: /tmp/generated-quality.json
