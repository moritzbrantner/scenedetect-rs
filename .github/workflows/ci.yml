name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.19.9
  UV_VERSION: 0.11.21

jobs:
  agent-check:
    # Canonical hosted owner of the AGENTS.md handoff gate: runs exactly
    # `bun run agent:check` on the pull-request head. Keep this job name stable;
    # it is the check branch protection requires.
    name: Agent check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify PySceneDetect oracle setup
        run: scripts/setup-python-oracle.sh

      - name: Agent check
        run: bun run agent:check

  native-fresh-clone:
    # Fresh-clone native path (#151): Rust + ffmpeg only. The checkout runs on
    # the host; the check runs in a separately started minimal Rust container
    # that mounts only the checkout (no runner tool or Node mounts) and has no
    # Python, pip, uv, Node.js, npm or Bun, so a hidden dependency fails.
    name: Native fresh clone
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NATIVE_IMAGE: rust:1.98.1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7
    steps:
      - uses: actions/checkout@v7

      - name: Native check in an isolated container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$NATIVE_IMAGE" \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends ffmpeg
              for tool in python python3 pip pip3 uv uvx node nodejs npm npx bun; do
                if command -v "$tool" >/dev/null 2>&1; then
                  echo "native fresh clone image unexpectedly provides $tool" >&2
                  exit 1
                fi
              done
              if compgen -G "/usr/bin/python3*" >/dev/null || compgen -G "/usr/local/bin/python3*" >/dev/null \
                || compgen -G "/usr/bin/node*" >/dev/null || test -e /__e; then
                echo "native fresh clone container exposes a forbidden runtime" >&2
                exit 1
              fi
              git config --global --add safe.directory /work 2>/dev/null || true
              scripts/native-check.sh
            '

  security-validation:
    name: Dependency security policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: Rust advisory check
        run: cargo audit

      - name: Rust dependency policy
        run: cargo deny check
