name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.19.9
  UV_VERSION: 0.11.21

jobs:
  fast-validation:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: WebAssembly build
        run: cargo build -p scenedetect-wasm --target wasm32-unknown-unknown

      - name: Tests
        run: cargo test --workspace

      - name: Verify PySceneDetect oracle setup
        run: scripts/setup-python-oracle.sh

      - name: PySceneDetect parity
        run: tests/parity/run-all.sh

  security-validation:
    name: Dependency security policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: Rust advisory check
        run: cargo audit

      - name: Rust dependency policy
        run: cargo deny check
