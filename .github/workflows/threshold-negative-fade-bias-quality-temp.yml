name: Threshold negative fade-bias quality v2

on:
  push:
    branches:
      - verify/threshold-negative-fade-bias-quality-v2

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          enable-cache: false
      - name: Run discovered generated quality case
        run: bun run quality:generated -- --case generated-threshold-negative-fade-bias
      - name: Print report
        if: always()
        run: cat tests/quality/output/report.json || true
