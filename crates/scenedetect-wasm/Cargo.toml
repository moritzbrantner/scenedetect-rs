[package]
name = "scenedetect-wasm"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
# The browser-only adapter consumes visual-analysis 0.1.x, whose published
# crates require Rust 1.95. Keep the published/core SceneDetect packages on the
# workspace's Rust 1.87 contract instead of raising the whole repository MSRV.
rust-version = "1.95"
version.workspace = true

[lib]
path = "src/browser_lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false }
# Owner crates are consumed as one exact git revision of the public repository (owner
# decision 2026-10-10: no crates.io releases for now), so the whole visual foundation
# graph comes from one consistent commit.
image-analysis-processing = { package = "moenarch-image-analysis-processing", git = "https://github.com/moritzbrantner/rust-packages", rev = "3c7f6f891d91d73a248921c0740067bc5e6e8451" }
scenedetect-core = { path = "../scenedetect-core" }
serde.workspace = true
serde_json.workspace = true
