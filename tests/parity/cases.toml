[oracle]
python = "3.12"
package = "scenedetect-headless==0.7"

[[cases]]
id = "content-hard-cut"
status = "required"
video = "tests/fixtures/generated/content-hard-cut.mkv"
detector = "detect-content"
threshold = "20"
args = []
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "content-threshold-gray-cut-low"
status = "required"
video = "tests/fixtures/generated/content-threshold-gray-cut.mkv"
detector = "detect-content"
threshold = "20"
args = []
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "content-threshold-gray-cut-high"
status = "required"
video = "tests/fixtures/generated/content-threshold-gray-cut.mkv"
detector = "detect-content"
threshold = "180"
args = []
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "content-luma-only-hard-cut"
status = "required"
video = "tests/fixtures/generated/content-hard-cut.mkv"
detector = "detect-content"
threshold = "100"
args = ["--luma-only"]
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "adaptive-fast-motion"
status = "required"
video = "tests/fixtures/generated/adaptive-fast-motion.mkv"
detector = "detect-adaptive"
threshold = "3"
args = ["--min-content-val", "15", "--frame-window", "2"]
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "threshold-fade-return"
status = "required"
video = "tests/fixtures/generated/threshold-fade-return.mkv"
detector = "detect-threshold"
threshold = "12"
args = []
min_scene_len = "1"
tolerance_frames = 1

[[cases]]
id = "content-min-scene-len-timecode"
status = "required"
video = "tests/fixtures/generated/content-hard-cut.mkv"
detector = "detect-content"
threshold = "20"
args = []
min_scene_len = "00:00:00.800"
tolerance_frames = 1

[[cases]]
id = "content-min-scene-len-close-cuts"
status = "required"
video = "tests/fixtures/generated/min-scene-len-close-cuts.mkv"
detector = "detect-content"
threshold = "20"
args = []
min_scene_len = "5"
tolerance_frames = 1

[[cases]]
id = "hist-hard-cut"
status = "expected-gap"
video = "tests/fixtures/generated/content-hard-cut.mkv"
detector = "detect-hist"
threshold = "0.05"
args = ["--bins", "256"]
min_scene_len = "1"
tolerance_frames = 1
reason = "scenedetect-rs does not yet expose a histogram Detector or detect-hist CLI command."

[[cases]]
id = "hash-hard-cut"
status = "expected-gap"
video = "tests/fixtures/generated/content-hard-cut.mkv"
detector = "detect-hash"
threshold = "0.395"
args = ["--size", "16", "--lowpass", "2"]
min_scene_len = "1"
tolerance_frames = 1
reason = "scenedetect-rs does not yet expose a perceptual hash Detector or detect-hash CLI command."
